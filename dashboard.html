<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard | Almanza Baptist Christian Academy</title>
<meta name="description" content="Staff dashboard for managing ABCA admissions applications.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header class="site-header">
<div class="header-inner">
<a href="dashboard.html" class="brand" aria-label="ABCA Staff Dashboard">
<img src="assets/logo.png" alt="ABCA logo" class="brand-logo">
<span class="brand-text">
<span class="brand-name">Almanza Baptist Christian Academy</span>
<span class="brand-sub">Staff Dashboard</span>
</span>
</a>
<nav aria-label="Main navigation">
<ul class="nav-links">
<li><button class="logout-btn" id="logoutBtnHeader">Log Out</button></li>
</ul>
</nav>
<button class="hamburger" aria-label="Open menu" aria-controls="sideNav" aria-expanded="false">
<span></span><span></span><span></span>
</button>
</div>
</header>

<aside class="side-nav" id="sideNav" aria-label="Mobile navigation">
<div class="side-nav-header">
<div class="brand">
<img src="assets/logo.png" alt="ABCA logo" class="brand-logo">
<span class="brand-text">
<span class="brand-name">ABCA</span>
<span class="brand-sub">Staff Dashboard</span>
</span>
</div>
<button class="side-close" aria-label="Close menu">&times;</button>
</div>
<ul class="side-nav-links">
<li><button class="logout-btn" id="logoutBtnSide">Log Out</button></li>
</ul>
</aside>

<div class="overlay" aria-hidden="true"></div>

<main class="dashboard-main">
<div class="container">

<section class="stats-section">
<div class="stat-card">
<span class="stat-label">Total Applicants</span>
<span class="stat-value skeleton" id="statValue">&nbsp;</span>
</div>
</section>

<section class="applicants-section">
<div class="section-header-row">
<h2>Current Applicants</h2>
</div>
<div class="applicants-table-wrapper">
<table class="applicants-table">
<thead>
<tr>
<th>Student Name</th>
<th>Age</th>
<th>Grade Level</th>
<th>Parent/Guardian</th>
<th>Email</th>
<th>Contact Number</th>
<th>Additional Info</th>
<th>Submitted</th>
<th></th>
</tr>
</thead>
<tbody id="applicantsBody"></tbody>
</table>
</div>
</section>

</div>
</main>

<footer class="dashboard-footer">
<div class="container">
<p>&copy; <span id="year"></span> Almanza Baptist Christian Academy. All rights reserved.</p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="index.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
