<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
:root {
--primary-green: #1B5E20;
--secondary-green: #2E7D32;
--primary-yellow: #FBC02D;
--bg-light: #F4F7F6;
--text-dark: #222222;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
background-color: var(--bg-light);
color: var(--text-dark);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
text-align: center;
padding: 2rem;
}

.error-code {
font-size: 12rem;
font-weight: 800;
color: var(--primary-green);
line-height: 1;
margin-bottom: 1rem;
text-shadow: 5px 5px 0px var(--primary-yellow);
}

.error-title {
font-size: 2.5rem;
font-weight: 700;
margin-bottom: 1.5rem;
color: var(--text-dark);
letter-spacing: -0.5px;
}

.error-message {
font-size: 1.2rem;
color: #555555;
margin-bottom: 3rem;
max-width: 500px;
line-height: 1.6;
}

.btn {
display: inline-block;
padding: 1rem 2.5rem;
background-color: var(--primary-green);
color: #FFFFFF;
text-decoration: none;
font-weight: 700;
font-size: 1.1rem;
border-radius: 2.5px;
transition: all 0.3s ease;
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.btn:hover {
transform: translateY(-3px);
box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
background-color: var(--primary-yellow);
color: var(--primary-green);
}

@media (max-width: 768px) {
.error-code {
font-size: 8rem;
text-shadow: 3px 3px 0px var(--primary-yellow);
}
.error-title {
font-size: 2rem;
}
.error-message {
font-size: 1.1rem;
}
}

@media (max-width: 480px) {
.error-code {
font-size: 6rem;
}
.error-title {
font-size: 1.75rem;
}
}
</style>
</head>
<body>

<h1 class="error-code">404</h1>
<h2 class="error-title">Page Not Found</h2>
<p class="error-message">The page you are looking for might have been removed, had its name changed, or still in progress.. :3</p>
<a href="index.html" class="btn">Return to Homepage</a>

</body>
</html>
