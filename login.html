<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabaseUrl = "https://mgofvanhrfjzxhpwsoys.supabase.co";
const supabaseKey = "sb_publishable_LD94Ab23HZtRGyNbf7sjmg_2N5sJSNi";

const supabase = createClient(supabaseUrl, supabaseKey);

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginMessage = document.getElementById("loginMessage");

function showMessage(message, type = "error") {
  loginMessage.textContent = message;
  loginMessage.className = `login-message ${type}`;
}

async function checkExistingSession() {
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    return;
  }

  const { data: admin, error } = await supabase
    .from("admins")
    .select("id, username")
    .eq("id", session.user.id)
    .maybeSingle();

  if (admin && !error) {
    window.location.href = "dashboard.html";
    return;
  }

  await supabase.auth.signOut();
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    showMessage("Please enter your username and password.");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Signing In...";
  showMessage("");

  const authEmail = `${username}@abca.local`;

  const { data, error } = await supabase.auth.signInWithPassword({
    email: authEmail,
    password
  });

  if (error) {
    loginButton.disabled = false;
    loginButton.textContent = "Sign In";
    showMessage("Invalid username or password.");
    return;
  }

  const { data: admin, error: adminError } = await supabase
    .from("admins")
    .select("id, username")
    .eq("id", data.user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await supabase.auth.signOut();

    loginButton.disabled = false;
    loginButton.textContent = "Sign In";
    showMessage("This account does not have administrator access.");
    return;
  }

  window.location.href = "dashboard.html";
});

checkExistingSession();
</script>
