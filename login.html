<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Almanza Baptist Christian Academy</title>
<meta name="description" content="Admin login for ABCA staff to manage admissions applications.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand" aria-label="ABCA Home">
      <img src="assets/logo.png" alt="ABCA logo" class="brand-logo">
      <span class="brand-text">
        <span class="brand-name">Almanza Baptist Christian Academy</span>
        <span class="brand-sub">Biblical Christian Education</span>
      </span>
    </a>
    <nav aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="admissions.html">Admissions</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="hamburger" aria-label="Open menu" aria-controls="sideNav" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<aside class="side-nav" id="sideNav" aria-label="Mobile navigation">
  <div class="side-nav-header">
    <div class="brand">
      <img src="assets/logo.png" alt="ABCA logo" class="brand-logo">
      <span class="brand-text">
        <span class="brand-name">ABCA</span>
        <span class="brand-sub">Christian Academy</span>
      </span>
    </div>
    <button class="side-close" aria-label="Close menu">&times;</button>
  </div>
  <ul class="side-nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="admissions.html">Admissions</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</aside>

<div class="overlay" aria-hidden="true"></div>

<section class="login-section">
  <div class="login-card">
    <img src="assets/logo.png" alt="ABCA logo" class="brand-logo">
    <h1>School Login</h1>
    <p class="subtitle">Hi there!</p>

    <div class="login-error" id="loginError"></div>

    <form class="login-form" id="loginForm">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary login-submit" id="loginBtn">Sign In</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      &copy; <span id="year">2026</span> Almanza Baptist Christian Academy. All rights reserved.
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="index.js"></script>
<script src="login.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
